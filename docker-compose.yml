services:
  jellyfin:
    image: jellyfin/jellyfin@sha256:78d3ea1207d1322471fcac39a614f004f2ccf7e878f95ab2977d752f07e4dd7e
    container_name: jellyfin
    network_mode: "service:tailscale"
    environment:
      - TZ=Europe/Madrid
    volumes:
      - ./docker/jellyfin:/config
      - ./docker/jellyfin-cache:/cache
      - ./:/data
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    depends_on:
      - tailscale

  jellyseerr:
    image: fallenbagel/jellyseerr@sha256:4538137bc5af902dece165f2bf73776d9cf4eafb6dd714670724af8f3eb77764
    container_name: jellyseerr
    environment:
      - LOG_LEVEL=info
      - TZ=Europe/Madrid
      - PORT=5055
    volumes:
      - ./docker/jellyseerr:/app/config
    ports:
      - "127.0.0.1:5055:5055"
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:5055/api/v1/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - media-network

  bazarr:
    image: lscr.io/linuxserver/bazarr@sha256:8b30e81c4aec2991f469e78fae8afaa89ecc9b21a80e3897f50427216b55470c
    container_name: bazarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Madrid
    volumes:
      - ./docker/bazarr:/config
      - ./:/data
    ports:
      - "127.0.0.1:6767:6767"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:6767"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - media-network

  sonarr:
    image: lscr.io/linuxserver/sonarr@sha256:f247545d23ba8b233d6604575347e48a623fe6ad75dda02348bf81917f3b5c06
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Madrid
    ports:
      - "127.0.0.1:8989:8989"
    volumes:
      - ./docker/sonarr:/config
      - ./:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8989/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - media-network

  radarr:
    image: lscr.io/linuxserver/radarr@sha256:adb6c09d6b729ea5e642c99cea35af72702ef476bf4763f153299ac5db9f0b4f
    container_name: radarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Madrid
    ports:
      - "127.0.0.1:7878:7878"
    volumes:
      - ./docker/radarr:/config
      - ./:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:7878/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - media-network

  prowlarr:
    image: lscr.io/linuxserver/prowlarr@sha256:f2b26429893d4c4cb71941b7ee50b1bdecd9d5f9f9e02d5410615e9f4f7c8d95
    container_name: prowlarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Madrid
    ports:
      - "127.0.0.1:9696:9696"
    volumes:
      - ./docker/prowlarr:/config
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:9696/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - media-network

  gluetun:
    image: qmcgaw/gluetun:v3.41.3
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - VPN_SERVICE_PROVIDER=nordvpn
      - VPN_TYPE=openvpn
      - OPENVPN_USER=${NORDVPN_USER}
      - OPENVPN_PASSWORD=${NORDVPN_PASSWORD}
      - OPENVPN_PROTOCOL=udp
      - SERVER_COUNTRIES=Spain
      - TZ=Europe/Madrid
      - FIREWALL_INPUT_PORTS=8112,58846
    volumes:
      - ./docker/gluetun:/gluetun
    ports:
      - "127.0.0.1:8112:8112"
    restart: unless-stopped
    networks:
      - media-network

  deluge:
    image: lscr.io/linuxserver/deluge@sha256:9505c64720afa9e5f0ac1576e660dd6d1e9d4a6733b791f4821e8f496f19f41f
    container_name: deluge
    network_mode: "service:gluetun"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Madrid
      - DELUGE_LOGLEVEL=error
    volumes:
      - ./docker/deluge:/config
      - ./:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8112"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    depends_on:
      - gluetun

  tailscale:
    image: tailscale/tailscale:v1.102.4
    container_name: tailscale
    hostname: media-server-share
    environment:
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
    volumes:
      - ./docker/tailscale:/var/lib/tailscale
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
    restart: unless-stopped
    networks:
      - media-network

  samba:
    image: ghcr.io/servercontainers/samba:smbd-only-a3.24.1-s4.23.8-r0
    container_name: samba
    network_mode: "service:tailscale"
    environment:
      TZ: Europe/Madrid
      ACCOUNT_media: ${SAMBA_PASSWORD}
      UID_media: 1000
      SAMBA_VOLUME_CONFIG_descargas: >
        [Descargas];
        path=/shares/descargas;
        valid users=media;
        guest ok=no;
        read only=yes;
        browseable=yes
    volumes:
      - ./:/shares/descargas:ro
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    depends_on:
      - tailscale

networks:
  media-network:
    driver: bridge
