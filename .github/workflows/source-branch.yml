name: Enforce Gitflow

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  source-branch:
    name: Source branch policy
    runs-on: ubuntu-latest
    env:
      BASE_BRANCH: ${{ github.base_ref }}
      HEAD_BRANCH: ${{ github.head_ref }}
    steps:
      - name: Validate source branch
        shell: bash
        run: |
          case "$BASE_BRANCH" in
            main)
              [[ "$HEAD_BRANCH" == release/* || "$HEAD_BRANCH" == hotfix/* ]]
              ;;
            develop)
              [[ "$HEAD_BRANCH" == feature/* || "$HEAD_BRANCH" == release/* || "$HEAD_BRANCH" == hotfix/* ]]
              ;;
            *)
              exit 1
              ;;
          esac || {
            echo "Invalid promotion path: $HEAD_BRANCH -> $BASE_BRANCH"
            echo "Required Gitflow: feature/* -> develop; release/* or hotfix/* -> main and develop"
            exit 1
          }
