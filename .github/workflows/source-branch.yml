name: Enforce Gitflow

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  source-branch:
    name: Source branch policy
    runs-on: ubuntu-latest
    env:
      BASE_BRANCH: ${{ github.base_ref }}
      HEAD_BRANCH: ${{ github.head_ref }}
    steps:
      - name: Validate source branch
        shell: bash
        run: |
          set -euo pipefail

          version='[0-9]+\.[0-9]+\.[0-9]+'
          description='[a-z0-9]+(-[a-z0-9]+)*'
          feature="^feature/${version}-${description}$"
          bugfix="^bugfix/${version}-${description}$"
          hotfix="^hotfix/${version}-${description}$"
          release="^release/${version}$"

          valid=false
          case "$BASE_BRANCH" in
            main)
              [[ "$HEAD_BRANCH" =~ $release || "$HEAD_BRANCH" =~ $hotfix ]] && valid=true
              ;;
            develop)
              [[ "$HEAD_BRANCH" =~ $feature || "$HEAD_BRANCH" =~ $bugfix || "$HEAD_BRANCH" =~ $release || "$HEAD_BRANCH" =~ $hotfix ]] && valid=true
              ;;
          esac

          if [[ "$valid" != true ]]; then
            echo "Invalid Gitflow branch or promotion path: $HEAD_BRANCH -> $BASE_BRANCH"
            echo "Allowed formats:"
            echo "  feature/X.Y.Z-description -> develop"
            echo "  bugfix/X.Y.Z-description -> develop"
            echo "  release/X.Y.Z -> main and develop"
            echo "  hotfix/X.Y.Z-description -> main and develop"
            exit 1
          fi
